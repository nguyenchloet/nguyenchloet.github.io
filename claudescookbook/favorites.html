<!DOCTYPE html> 
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Favorites | Claude's Cookbook</title>
        <link rel="stylesheet" href="recipestyle.css">
        <link rel="stylesheet" href="favorites.css">
    </head>
    <body>
        <div class="outline">
            <header>
                <nav class="nav-menu">
                    <ul class="nav-ul">
                        <li class="nav-header"><strong>Claude's Cookbook</strong></li>
                        <ul class="nav-ul-right">
                            <li><a href="index.html">Recipes</a></li>
                            <li><a href="recipe-index.html">Recipe Index</a></li>
                            <li class="cooking-mode-control">
                                <button
                                    id="cooking-mode-toggle"
                                    class="toggle-switch"
                                    type="button"
                                    role="switch"
                                    aria-checked="false"
                                    aria-label="Cooking Mode"
                                >
                                    <span class="toggle-knob"></span>
                                </button>
                                <span>Cooking Mode<br><small>(Keep Screen On)</small></span>
                            </li>
                            <button id="theme-toggle" type="button" aria-label="Switch to dark mode">☾</button>
                        </ul>
                    </ul>
                </nav>
            </header>

            <main id="favorites-page">
                <h3>Favorite Recipes (External)</h3>
                <button type="button" id="toggle-favorite-form">
                    Add a Favorite Recipe
                </button>
                <section class="favorite-form-section" hidden>
                    <h2>Save a Recipe</h2>

                    <form id="favorite-form">
                        <label for="recipe-url">Recipe website URL</label>
                    <div class="import-url-row">
                        <input
                            type="url"
                            id="recipe-url"
                            placeholder="https://example.com/recipe"
                            required
                        >
                        <button type="button" id="import-recipe-button">Import Recipe</button>
                    </div>
                    <p id="import-status" role="status" aria-live="polite"></p>
                    <label for="recipe-title">Recipe title</label>
                    <input type="text" id="recipe-title" required>

                    <label for="recipe-yield">Yield</label>
                    <input type="text" id="recipe-yield">

                    <label for="recipe-ingredients">Ingredients</label>
                    <textarea id="recipe-ingredients" placeholder="One ingredient per line"></textarea>

                    <label for="recipe-directions">Directions</label>
                    <textarea id="recipe-directions" placeholder="One step per line"></textarea>

                    <label for="recipe-notes">Personal notes</label>
                    <textarea id="recipe-notes" placeholder="Optional notes"></textarea>
                    <button type="submit">Save Favorite</button>
                    </form>
                </section>

                <section class="saved-favorites-section">
                    <h2>Saved Recipes</h2>
                    <div id="favorites-container">
                        <p id="no-favorites-message">You haven't saved any favorite recipes yet.</p>
                    </div>
                </section>
            </main>
        </div>

        <footer>
            <p>&copy; 2026 Claude's Cookbook. All rights reserved.</p>
        </footer>

        <script src="favorites.js"></script>
        <script>
            const themeToggle = document.getElementById("theme-toggle");
            const savedTheme = localStorage.getItem("theme") || "light";

            document.documentElement.setAttribute("data-theme", savedTheme);

            function updateThemeButton() {
                const currentTheme = document.documentElement.getAttribute("data-theme");

                themeToggle.textContent = currentTheme === "dark" ? "☀" : "☾";
                themeToggle.setAttribute(
                    "aria-label",
                    currentTheme === "dark" ? "Switch to light mode" : "Switch to dark mode"
                );
            }

            updateThemeButton();

            themeToggle.addEventListener("click", () => {
                const currentTheme = document.documentElement.getAttribute("data-theme");
                const newTheme = currentTheme === "dark" ? "light" : "dark";

                document.documentElement.setAttribute("data-theme", newTheme);
                localStorage.setItem("theme", newTheme);
                updateThemeButton();
            });
        </script>
    </body>
</html>
